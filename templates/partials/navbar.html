<nav class="navbar">
    <div class="navbar-brand">USDT <span class="accent">Tracker</span></div>
    {% if session.get('user_id') %}
        <div class="navbar-user">
            <div class="currency-selector">
                <select id="currency-select" class="currency-select">
                    <option value="usd">🇺🇸 USD</option>
                    <option value="eur">🇪🇺 EUR</option>
                    <option value="gbp">🇬🇧 GBP</option>
                    <option value="jpy">🇯🇵 JPY</option>
                    <option value="inr">🇮🇳 INR</option>
                    <option value="cad">🇨🇦 CAD</option>
                    <option value="aud">🇦🇺 AUD</option>
                    <option value="chf">🇨🇭 CHF</option>
                    <option value="cny">🇨🇳 CNY</option>
                    <option value="krw">🇰🇷 KRW</option>
                    <option value="sgd">🇸🇬 SGD</option>
                    <option value="hkd">🇭🇰 HKD</option>
                </select>
            </div>
            Signed in as <span class="username">{{ session.get('username') }}</span>
            <a href="{{ url_for('logout') }}" class="btn btn-sm btn-outline">Logout</a>
        </div>
    {% else %}
        <a href="{{ url_for('login') }}" class="btn btn-sm btn-outline">Login</a>
    {% endif %}
</nav>
