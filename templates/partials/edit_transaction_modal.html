<div class="modal-overlay" id="edit-modal" style="display: none;">
    <div class="modal">
        <div class="modal-header">
            <h3>Edit Transaction</h3>
            <span class="modal-close" id="edit-modal-close">&times;</span>
        </div>
        <div class="modal-body">
            <form id="edit-transaction-form">
                <input type="hidden" name="id">
                <div class="form-group">
                    <label>Type</label>
                    <select name="transaction_type" required>
                        <option value="BUY">BUY</option>
                        <option value="SELL">SELL</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount (USDT)</label>
                    <input type="number" step="0.00000001" name="amount" required>
                </div>
                <div class="form-group">
                    <label>Buy Price (USD)</label>
                    <input type="number" step="0.00000001" name="buy_price" required>
                </div>
                <div class="form-group">
                    <label>Transaction Date</label>
                    <input type="date" name="transaction_date" required>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Update</button>
                    <button type="button" class="btn btn-danger" id="delete-transaction-btn">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
