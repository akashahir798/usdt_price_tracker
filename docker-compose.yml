services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_TYPE=mysql
      - MYSQL_HOST=db
      - MYSQL_USER=tracker
      - MYSQL_PASSWORD=tracker123
      - MYSQL_DB=usdt_tracker
      - SECRET_KEY=change-this-in-production
      - COIN_API_URL=https://api.coingecko.com/api/v3
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: usdt_tracker
      MYSQL_USER: tracker
      MYSQL_PASSWORD: tracker123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "3307:3306"
    restart: unless-stopped

volumes:
  mysql_data:
