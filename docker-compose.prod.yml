version: '3.8'

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - DB_TYPE=mysql
      - MYSQL_HOST=db
      - MYSQL_USER=tracker
      - MYSQL_PASSWORD=tracker123
      - MYSQL_DB=usdt_tracker
      - SECRET_KEY=change-this-in-production-use-openssl-rand
    depends_on:
      - db
    expose:
      - "5000"  # Only exposed to nginx, not the public

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: usdt_tracker
      MYSQL_USER: tracker
      MYSQL_PASSWORD: tracker123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    expose:
      - "3306"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/data:/var/www/certbot:ro
      - static_volume:/app/static
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/data:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM $$; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$; done'"

volumes:
  mysql_data:
  static_volume:
